name: FantasyBot Autonomous Agent

on:
  schedule:
    # 15:00 UTC (17:00 hora peninsular española)
    - cron: '0 15 * * *'
    # 20:10 UTC (22:10 hora peninsular española - justo antes del cierre de mercado a las 22:18)
    - cron: '10 20 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón desde GitHub

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore credentials
        env:
          LALIGA_TOKENS: ${{ secrets.LALIGA_TOKENS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os, json
          tok = os.environ.get('LALIGA_TOKENS', '')
          if tok:
              try:
                  data = json.loads(tok.strip(), strict=False)
                  with open('tokens.json', 'w', encoding='utf-8') as f:
                      json.dump(data, f, indent=2)
              except Exception:
                  with open('tokens.json', 'w', encoding='utf-8') as f:
                      f.write(tok)
          key = os.environ.get('GEMINI_API_KEY', '')
          if key:
              with open('.env', 'w', encoding='utf-8') as f:
                  f.write(f'GEMINI_API_KEY={key}\n')
          "

      - name: Run Gemini Agent (Autonomous Review & Actions)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LALIGA_TOKENS: ${{ secrets.LALIGA_TOKENS }}
        run: |
          python -m fantasybot gemini --execute

      - name: Commit updated memory
        continue-on-error: true
        run: |
          git config --global user.name "FantasyBot Agent"
          git config --global user.email "fantasybot@users.noreply.github.com"
          git stash || true
          git pull --rebase origin main || true
          git stash pop || true
          git add hermes/MEMORY.md public/index.html .state/chart_history.json .state/reasoning_history.json .state/events.jsonl || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(agent): update manager memory, events, and dashboard [skip ci]" || true
            git push origin main || true
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
